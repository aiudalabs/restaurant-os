name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web / ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin_app, customer_web, waiter_web, kitchen_web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: apps/${{ matrix.app }}
      # Siempre se construye contra dev: el guard de vite rechaza `production`.
      - run: npm run build -- --mode restaurant-os-dev-49096
        working-directory: apps/${{ matrix.app }}

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - run: npm run test:unit
        working-directory: functions

  bff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/fastapi_bff/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: apps/fastapi_bff
      # test_auth y test_catalog_sync necesitan un Odoo vivo; Odoo se abandona.
      - run: >
          python -m pytest -q
          --ignore=tests/test_auth.py
          --ignore=tests/test_catalog_sync.py
        working-directory: apps/fastapi_bff
