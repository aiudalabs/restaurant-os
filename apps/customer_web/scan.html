<style>
  :root{--bg:#F5F2EC;--card:#fff;--ink:#1C1C1E;--muted:#7C736C;--brand:#E23744;--line:#E7E1D8}
  @media (prefers-color-scheme:dark){:root{--bg:#17140F;--card:#211D18;--ink:#F3EDE4;--muted:#A79C90;--line:#332C24}}
  :root[data-theme=light]{--bg:#F5F2EC;--card:#fff;--ink:#1C1C1E;--muted:#7C736C;--line:#E7E1D8}
  :root[data-theme=dark]{--bg:#17140F;--card:#211D18;--ink:#F3EDE4;--muted:#A79C90;--line:#332C24}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:28px 18px}
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
    border-radius:26px;padding:30px 28px 26px;text-align:center;
    box-shadow:0 24px 50px -28px rgba(0,0,0,.35)}
  .eyebrow{margin:0;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--brand)}
  h1{margin:8px 0 2px;font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:27px}
  .sub{margin:0 0 20px;font-size:14px;color:var(--muted)}
  .qr{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;display:inline-block;line-height:0}
  .qr img{width:min(300px,72vw);height:auto;border-radius:8px}
  .hint{margin:18px 0 0;font-size:13px;color:var(--muted)}
  .link{display:block;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;
    font-family:ui-monospace,SF Mono,Menlo,monospace;font-size:12px;color:var(--ink);word-break:break-all;text-decoration:none}
  .link:hover{border-color:var(--brand);color:var(--brand)}
  .tag{display:inline-block;margin-top:14px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--brand) 8%,transparent);
    border-radius:999px;padding:5px 12px}
</style>
