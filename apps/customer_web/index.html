<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Pedidos</title>
    <link rel="icon" type="image/svg+xml" href="/icons/platform.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3B5BDB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Manifest per branch (customerManifest): from the link's ?org&branch, else the
         restaurant this device remembers. Set before load so Chrome reads the right one. -->
    <script>
      (function () {
        var p = new URLSearchParams(location.search);
        var org = p.get('org'), branch = p.get('branch');
        if (!branch) {
          try {
            var h = JSON.parse(localStorage.getItem('ros_customer_home') || 'null');
            if (h) { org = h.orgId; branch = h.branchId; if (h.branchName) document.title = h.branchName; }
          } catch (e) {}
        }
        var l = document.createElement('link');
        l.rel = 'manifest';
        l.href = '/manifest.webmanifest' + (org && branch ? '?org=' + encodeURIComponent(org) + '&branch=' + encodeURIComponent(branch) : '');
        document.head.appendChild(l);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Theme before first paint: applies the branding cached for this branch (written by
         src/lib/branding.ts, validated there) as CSS variables, title, theme-color, icons and
         the font of the chosen preset. No cache -> neutral platform theme (defaults in index.css). -->
    <script>
      (function () {
        var FONT = 'https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Hanken+Grotesk:wght@400..700&display=swap';
        var t = null;
        try {
          var p = new URLSearchParams(location.search);
          var branch = p.get('branch');
          if (!branch) {
            var h = JSON.parse(localStorage.getItem('ros_customer_home') || 'null');
            branch = h && h.branchId;
          }
          if (branch) {
            var e = JSON.parse(localStorage.getItem('ros_theme_v1_' + branch) || 'null');
            if (e && e.v === 1 && e.theme) t = e.theme;
          }
        } catch (err) {}
        var href = FONT;
        try {
          if (t) {
            var root = document.documentElement;
            for (var k in t.vars) {
              if (/^--[a-z-]+$/.test(k) && typeof t.vars[k] === 'string') root.style.setProperty(k, t.vars[k]);
            }
            if (typeof t.title === 'string') document.title = t.title;
            if (/^#[0-9A-Fa-f]{6}$/.test(t.themeColor)) document.querySelector('meta[name="theme-color"]').content = t.themeColor;
            if (typeof t.iconUrl === 'string' && t.iconUrl.indexOf('https://') === 0) {
              document.querySelectorAll('link[rel="icon"]').forEach(function (n) { n.remove(); });
              ['icon', 'apple-touch-icon'].forEach(function (rel) {
                var l = document.createElement('link'); l.rel = rel; l.href = t.iconUrl; document.head.appendChild(l);
              });
            }
            if (typeof t.fontHref === 'string' && t.fontHref.indexOf('https://fonts.googleapis.com/') === 0) href = t.fontHref;
          }
        } catch (err) {}
        var f = document.createElement('link');
        f.rel = 'stylesheet'; f.href = href; f.setAttribute('data-brand-font', '');
        document.head.appendChild(f);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
